<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>저장된 토픽 - Deep Study with AI</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .topic-card { cursor: pointer; transition: transform 0.2s; }
        .topic-card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .topic-link { text-decoration: none; color: inherit; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/topics">Deep Study with AI</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="/topics/new">새 토픽</a>
        </div>
        <div class="navbar-nav ms-auto">
            <span class="nav-item nav-link text-light me-3" sec:authentication="name">사용자 이메일</span>
            <a class="btn btn-outline-light btn-sm" href="/members/logout">로그아웃</a>
        </div>
    </div>
</nav>

<main class="container mt-5">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <header class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h1>저장된 토픽</h1>
            <p class="text-muted">학습 중인 토픽 목록입니다. 토픽을 선택하여 대화를 이어가세요.</p>
        </div>
        <a href="/topics/new" class="btn btn-primary">새 토픽 생성</a>
    </header>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div th:each="topic : ${topics}" class="col">
            <div class="card h-100 topic-card shadow-sm">
                <a th:href="@{/topics/{id}(id=${topic.id})}" class="topic-link flex-grow-1">
                    <div class="card-body">
                        <h5 class="card-title text-primary" th:text="${topic.title}">토픽 제목</h5>
                        <p class="text-muted small mb-0">
                            생성일: <span th:text="${#temporals.format(topic.createdAt, 'yyyy-MM-dd')}">2026-02-26</span>
                        </p>
                    </div>
                </a>
                <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center">
                    <form th:action="@{/topics/{id}/delete(id=${topic.id})}" method="post" onsubmit="return confirm('이 토픽을 삭제하시겠습니까? 관련된 모든 질문과 답변이 삭제됩니다.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                    </form>
                    <a th:href="@{/topics/{id}(id=${topic.id})}" class="btn btn-sm btn-outline-primary">대화 보기</a>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(topics)}" class="col-12 text-center py-5">
            <p class="text-muted">저장된 토픽이 없습니다. 새로운 토픽을 만들어보세요!</p>
            <a href="/topics/new" class="btn btn-outline-primary mt-2">첫 토픽 만들기</a>
        </div>
    </div>
</main>

<footer class="text-center text-muted py-4 mt-5">
    <p>&copy; 2026 DeepStudyWithAI. All Rights Reserved.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
