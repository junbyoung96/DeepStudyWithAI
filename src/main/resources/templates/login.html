<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 - Deep Study with AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">로그인</h3>
                </div>
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger">
                        이메일 또는 비밀번호가 올바르지 않습니다.
                    </div>
                    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
                    
                    <form th:action="@{/members/login}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <input type="email" class="form-control" id="email" name="email" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">로그인</button>
                            <a href="/members/signup" class="btn btn-outline-secondary">회원가입</a>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <a href="/" class="text-decoration-none text-muted">홈으로</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
