<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>토픽 관리 - Deep Study with AI</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/topics">Deep Study with AI</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" href="/topics/new">새 토픽</a>
        </div>
        <div class="navbar-nav ms-auto">
            <span class="nav-item nav-link text-light me-3" sec:authentication="name">사용자 이메일</span>
            <a class="btn btn-outline-light btn-sm" href="/members/logout">로그아웃</a>
        </div>
    </div>
</nav>

<main class="container mt-5">
    <header class="text-center mb-5">
        <h1>학습 토픽 관리</h1>
        <p class="lead">새로운 주제를 시작하거나 기존 주제를 이어서 학습하세요.</p>
    </header>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <!-- 새 토픽 생성 섹션 -->
        <div class="col-md-5 mb-4">
            <section class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0">새 토픽 생성</h2>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/topics}">
                        <div class="mb-3">
                            <label for="topic-title" class="form-label">학습 주제 제목</label>
                            <input type="text" id="topic-title" name="title" class="form-control"
                                   placeholder="예: Spring Boot JPA 성능 최적화" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">새로운 학습 시작하기</button>
                    </form>
                </div>
            </section>
        </div>

        <!-- 기존 토픽 목록 섹션 -->
        <div class="col-md-7 mb-4">
            <section class="card shadow-sm h-100">
                <div class="card-header bg-dark text-white">
                    <h2 class="h5 mb-0">학습 중인 토픽 목록</h2>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(topics)}" class="text-center py-5">
                        <p class="text-muted">아직 생성된 토픽이 없습니다. 왼쪽에서 첫 토픽을 생성해보세요!</p>
                    </div>
                    <div th:unless="${#lists.isEmpty(topics)}" class="list-group list-group-flush">
                        <a th:each="topic : ${topics}" 
                           th:href="@{/topics/{id}(id=${topic.id})}" 
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            <div>
                                <strong th:text="${topic.title}">토픽 제목</strong>
                                <br>
                                <small class="text-muted" th:text="${#temporals.format(topic.createdAt, 'yyyy-MM-dd HH:mm')} + ' 생성'"></small>
                            </div>
                            <span class="badge bg-primary rounded-pill" th:text="${#lists.size(topic.questions)} + ' 대화'">0</span>
                        </a>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<footer class="text-center text-muted py-4 mt-5">
    <p>&copy; 2026 DeepStudyWithAI. All Rights Reserved.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
