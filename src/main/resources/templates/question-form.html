<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deep Study with AI</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<main class="container mt-5">
    <header class="text-center mb-4">
        <h1>Deep Study with AI</h1>
        <p class="lead">AI와 함께 깊이 있는 지식을 탐험하세요.</p>
    </header>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <section class="card p-4 mb-4">
        <h2 class="card-title h4 mb-3">궁금한 점을 입력하세요</h2>
        <form method="post" action="/questions">
            <div class="mb-3">
                <label for="topic-select" class="form-label">주제 선택</label>
                <select id="topic-select" name="topicId" class="form-select" required>
                    <option value="">-- 주제를 선택하세요 --</option>
                    <option th:each="topic : ${topics}" th:value="${topic.id}" th:text="${topic.title}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="question-textarea" class="form-label visually-hidden">질문</label>
                <textarea id="question-textarea"
                          name="content"
                          class="form-control"
                          rows="5"
                          placeholder="예: USIM 칩은 어떤 정보를 가지고 있나요?"
                          required></textarea>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">질문하기</button>
            </div>
        </form>
    </section>

</main>

<footer class="text-center text-muted py-4">
    <p>&copy; 2026 DeepStudyWithAI. All Rights Reserved.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
