spring:
  application:
    name: deepStudyWithAI
  datasource:
    url: jdbc:sqlite:knowledge.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.community.dialect.SQLiteDialect


openai:
  api-key: ${OPENAI_API_KEY}
